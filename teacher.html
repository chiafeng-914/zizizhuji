<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>字字珠璣｜老師專用</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .cls{background:var(--sheet);border:1px solid var(--rule);padding:16px 18px;margin-top:14px}
  .cls h3{margin:0;font-size:20px;letter-spacing:.15em}
  .code{font-family:var(--sans);font-size:28px;font-weight:700;letter-spacing:.25em;color:var(--vermilion)}
  .meta{font-size:14px;color:var(--ink-soft)}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
  .mini{border:1px solid var(--rule);background:var(--paper);padding:6px 14px;min-height:40px;font-size:15px}
  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:16px}
  th,td{text-align:left;padding:8px 4px;border-top:1px dashed var(--rule)}
  th{font-size:13px;color:var(--ink-soft);font-weight:500;letter-spacing:.2em}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mini.danger{color:var(--vermilion);border-color:var(--vermilion)}
  .mini:disabled{opacity:.5}
  form.edit{margin-top:10px;padding-top:4px;border-top:1px dashed var(--rule)}
  form.edit input{font-size:18px;min-height:44px;padding:6px 4px}
</style>
</head>
<body>
<main id="app"><p class="hint">載入中…</p></main>
<script type="module" src="teacher.js"></script>
</body>
</html>
